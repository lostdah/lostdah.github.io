<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donaciones - LosTDAH sitio web cool</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="top-nav">
      <div class="logo-area" style="display: flex; align-items: center; gap: 15px;">
        <div class="nav-logo">
          <img src="logo-perros.png" alt="Logo Huellas al Lodo" class="logo-img">
          Huellas al Lodo
        </div>
        <a href="#" id="darkModeToggle" class="dark-toggle" title="Modo Oscuro">&#127769;</a>
      </div>
      <div class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="quienes-somos.html">Quiénes somos</a>
        <a href="nuestro-camino.html">Nuestro camino</a>
        <a href="sumate.html">Súmate</a>
      </div>
    </div>

    <div class="main-content-centered">
      <div class="mensaje-donaciones">
        No estamos aceptando voluntarios por el momento.
        <span>¡Gracias!</span>
      </div>
    </div>
  <script>
      const darkModeToggle = document.getElementById('darkModeToggle');
      if (localStorage.getItem('dark-mode') === 'enabled') {
        document.body.classList.add('dark-mode');
        if(darkModeToggle) darkModeToggle.innerHTML = '&#9728;&#65039;';
      }
      if(darkModeToggle) {
        darkModeToggle.addEventListener('click', (e) => {
          e.preventDefault();
          document.body.classList.toggle('dark-mode');
          if (document.body.classList.contains('dark-mode')) {
            localStorage.setItem('dark-mode', 'enabled');
            darkModeToggle.innerHTML = '&#9728;&#65039;';
          } else {
            localStorage.setItem('dark-mode', 'disabled');
            darkModeToggle.innerHTML = '&#127769;';
          }
        });
      }
    </script>
  </body>
</html>
